[package]
name = "arbor"
version = "0.15.6"
description = "A friendly Git client for Linux, the BSDs, macOS and Windows"
license = "GPL-3.0-or-later"
authors = ["The Arbor authors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "arbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", features = ["https", "ssh", "vendored-libgit2"] }
thiserror = "2"
dirs = "6"
tempfile = "3"
regex-lite = "0.1"
open = "5"
chrono = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Linux/BSD: GTK's program name is what desktops match windows to launchers
# by (see src/desktop.rs). Already used by Tauri; this is the same version.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

# macOS: build OpenSSL (used by libgit2 and libssh2) into the app. Otherwise it
# would link against Homebrew's copy, which users don't have, and the Intel
# half of a universal build couldn't find one at all.
[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
