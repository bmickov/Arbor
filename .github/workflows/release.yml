# Publishes a release: builds every platform and attaches the installers to
# a GitHub release for a version tag. CI starts it on its own after tagging a
# push to main whose version is new (see the tag job in ci.yml); pushing a
# tag yourself (git tag v0.6.0 && git push origin v0.6.0) also works. The tag
# must match the version in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.6.0
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          ok=true
          for f in package.json src-tauri/tauri.conf.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$version" ]; then echo "::error file=$f::Version is $v but the tag is $TAG."; ok=false; fi
          done
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$v" != "$version" ]; then echo "::error file=src-tauri/Cargo.toml::Version is $v but the tag is $TAG."; ok=false; fi
          $ok
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
    secrets: inherit

  # Publishes whatever was built, even when some platforms failed or timed
  # out, so one slow or broken runner doesn't hold back everyone else. The
  # notes list only the files that are there. Run this workflow again by hand
  # for the same tag later to add the missing ones (files are replaced).
  publish:
    name: Publish release
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: arbor-*
          path: release
          merge-multiple: true

      - name: Write checksums and release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          mkdir -p release
          cd release
          if [ -z "$(ls)" ]; then
            echo "::error::No platform built successfully, so there's nothing to publish."
            exit 1
          fi
          ls -l
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          has() { ls $1 > /dev/null 2>&1; }
          missing=""
          {
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "| --- | --- |"
            if has '*_x64-setup.exe'; then
              echo "| **Windows** 10 and 11 (x64) | \`Arbor_${VERSION}_x64-setup.exe\` (installer), or the \`.msi\` |"
            else missing="$missing Windows,"; fi
            if has '*.dmg'; then
              echo "| **macOS** 10.15 or later (Apple silicon and Intel) | \`Arbor_${VERSION}_universal.dmg\` |"
            else missing="$missing macOS,"; fi
            if has '*.deb'; then
              echo "| **Debian, Ubuntu, Mint, Pop!_OS** | $(ls *.deb | sed 's/.*/\`&\`/' | paste -sd ' ' | sed 's/ / or /g') |"
            fi
            if has '*.rpm'; then
              echo "| **Fedora, openSUSE, RHEL** | $(ls *.rpm | sed 's/.*/\`&\`/' | paste -sd ' ' | sed 's/ / or /g') |"
            fi
            if has '*.AppImage'; then
              echo "| **Any Linux** | $(ls *.AppImage | sed 's/.*/\`&\`/' | paste -sd ' ' | sed 's/ / or /g') |"
            else missing="$missing Linux,"; fi
            if has '*freebsd*.tar.gz'; then
              echo "| **FreeBSD** 14+ (x64) | \`$(ls *freebsd*.tar.gz)\` |"
            else missing="$missing FreeBSD,"; fi
            echo
            if [ -n "$missing" ]; then
              echo "> **Coming later:**${missing%,}. The build didn't finish in time; the files will be added to this release."
              echo
            fi
            echo "The builds aren't signed with a paid certificate yet, so the first launch asks for confirmation:"
            echo "on **macOS**, open System Settings → Privacy & Security and choose *Open Anyway*;"
            echo "on **Windows**, choose *More info → Run anyway*. On **FreeBSD**, run \`pkg install webkit2-gtk_41 git\`,"
            echo "then \`./install.sh\` from the unpacked folder. \`SHA256SUMS.txt\` lists every file's checksum."
          } > ../notes.md
          cat ../notes.md
          if [ -n "$missing" ]; then
            echo "::warning::Publishing without:${missing%,} (build result: $BUILD_RESULT)."
          fi

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            pre=""
            case "$VERSION" in *-*) pre="--prerelease" ;; esac
            gh release create "$TAG" release/* --verify-tag $pre \
              --title "Arbor $VERSION" --notes-file notes.md --generate-notes
          fi
