# Checks and tests every push and pull request, and builds the installers
# for all platforms. Each run's installers can be downloaded from the run's
# summary page ("Artifacts"). Changes to documentation alone don't rebuild,
# and neither does an empty commit: a push that touches no path outside
# paths-ignore starts no run, so rebuild such a commit from the Actions
# page ("Run workflow") instead.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "design/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "design/**", "LICENSE"]
  workflow_dispatch:

# A newer push to a pull request replaces its older run. On main every
# commit gets a full build: cancelling there stopped the slowest jobs (the
# macOS builds) whenever another commit came in.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build the web UI
        run: |
          npm ci
          npm run build

      # The tests drive the git command line to set up repositories.
      - name: Configure git
        run: |
          git config --global user.name "Arbor CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --locked

  # Builds start once the web UI checks pass, alongside the tests, so a test
  # failure on one system doesn't hold back everyone's installers.
  build:
    name: Build
    needs: [web]
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Releases happen by bumping the version: when a push to main passes the
  # checks and tests and its version has no tag yet, this tags the commit
  # (v<version>) and starts the Release workflow for that tag. Any other
  # push does nothing here. A tag made with the workflow's token doesn't
  # trigger workflows itself, so the release is started explicitly.
  tag:
    name: Tag and release new version
    needs: [web, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      actions: write # start the Release workflow
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          ok=true
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$v" != "$version" ]; then echo "::error file=src-tauri/tauri.conf.json::Version is $v but package.json says $version."; ok=false; fi
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$v" != "$version" ]; then echo "::error file=src-tauri/Cargo.toml::Version is $v but package.json says $version."; ok=false; fi
          $ok
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Tag the commit and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists, so there's nothing new to release."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $TAG."
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
          echo "::notice::Tagged $TAG and started the Release workflow."
